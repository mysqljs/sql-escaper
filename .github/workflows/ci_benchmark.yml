name: '🎖️ CI — Benchmark'

on:
  pull_request:
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
    name: Compare
    steps:
      - name: ➕ Actions - Checkout
        uses: actions/checkout@v7

      - name: ➕ Actions - Setup Node.js
        uses: actions/setup-node@v7
        with:
          check-latest: true
          node-version: lts/*

      - name: ➕ Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-linux-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-linux-

      - name: ➕ Actions — Setup Hyperfine
        run: cargo install --locked hyperfine

      - name: ➕ Cache dependencies (Benchmark)
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-benchmark-${{ hashFiles('benchmark/package-lock.json') }}
          restore-keys: npm-benchmark-

      - name: 📦 Installing Dependencies
        run: npm ci

      - name: 🚀 Building SQL Escaper
        run: npm run build

      - name: 🎖️ Rock it
        run: npm run benchmark
