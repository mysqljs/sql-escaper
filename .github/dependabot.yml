version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /
      - /benchmark
    schedule:
      interval: weekly
    versioning-strategy: increase
    commit-message:
      prefix: chore
      include: scope
    groups:
      prettier:
        patterns:
          - '*prettier*'
      typescript:
        patterns:
          - typescript
          - '@types/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns:
          - actions/*
